<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Kampala Fresh Market">
    <meta name="author" content="Atukunda Jacob">
    <title>Contact | Kampala Fresh Market</title>
    <link rel="stylesheet" href="styles/project.css">
    <script src="scripts/project.js" defer></script>
</head>
<body>
    <header>
        <h1>Kampala Fresh Market</h1>
        <button id="menuBtn">☰</button>
        <nav><ul id="navMenu">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul></nav>
    </header>
    <main>
        <h2>Order Now / Contact Us</h2>
        <form id="orderForm">
            <label>Name: <input type="text" name="name" required></label>
            <label>Phone: <input type="tel" name="phone" required></label>
            <label>Location in Kampala: 
                <select name="location" required>
                    <option value="">Select...</option>
                    <option value="central">Central</option>
                    <option value="nakawa">Nakawa</option>
                    <option value="kawempe">Kawempe</option>
                    <option value="makindye">Makindye</option>
                </select>
            </label>
            <label>Order Details: <textarea name="message" required></textarea></label>
            <button type="submit">Submit Order</button>
        </form>
        <div id="formMessage"></div>
    </main>
    <footer>
        <p>&copy; 2026 Atukunda Jacob | WDD 131</p>
        <p id="lastModified"></p>
        <a href="references.html">References</a>
    </footer>
</body>
</html>
