<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review - WDD 131</title>
    <meta name="description" content="W05 Product Review Form - WDD 131">
    <meta name="author" content="Atukunda Jacob">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="review-form">
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <label><input type="radio" id="star1" name="rating" value="1" required>★</label>
                    <label><input type="radio" id="star2" name="rating" value="2" required>★★</label>
                    <label><input type="radio" id="star3" name="rating" value="3" required>★★★</label>
                    <label><input type="radio" id="star4" name="rating" value="4" required>★★★★</label>
                    <label><input type="radio" id="star5" name="rating" value="5" required>★★★★★</label>
                </div>
            </fieldset>
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
            <fieldset>
                <legend>Which features did you find useful in the product?<br><em>(Check all that apply)</em></legend>
                <label><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
                <label><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
                <label><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
                <label><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>
            <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>
            <label for="userName">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="userName" name="userName">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> 🎓 Atukunda Jacob 🎓 Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
